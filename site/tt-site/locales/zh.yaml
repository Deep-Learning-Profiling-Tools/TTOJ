  "Open a finished submission to see each testcase, warmup count, sample count, median, p95, MAD, and coefficient of variation. Download the JSON report and any available device CSV traces to reproduce the analysis.": "打开已完成的提交，查看每个测试点的热身次数、样本数、中位数、P95、MAD 与变异系数。下载 JSON 报告和可用的设备 CSV trace，以复现实验分析。",
  "Device cycles are converted to microseconds using the recorded device clock. Parallel stages overlap: adding their durations does not produce end-to-end kernel latency.": "使用报告中记录的设备时钟把 cycles 换算为微秒。并行 stage 会重叠，直接相加不能得到端到端 kernel 延迟。",
  "A missing device trace is shown as unavailable, never replaced by host timing. Record wall time remains separate from the warmed measurements.": "缺失设备 trace 时显示“不可用”，不会用主机计时替代。记录墙钟时间也与热身后的测量分开。",
  "Compare experiments fairly": "公平比较实验",
  "Use the same inputs, source, image, driver, firmware, device allocation, CPU affinity, warmup, and sample count. The report records these details. Serial scheduling prevents two OJ jobs from sharing the mesh, but does not establish that outside processes are idle.": "比较实验时保持输入、源码、镜像、驱动、固件、设备分配、CPU 亲和性、热身次数和样本数一致，报告会记录这些信息。串行调度可避免两个 OJ 任务共享 mesh，但不代表外部进程处于空闲。",
  "Experimental profiles are not used for a performance leaderboard. Check the report quality notes before drawing conclusions.": "当前性能剖析不用于性能排行榜。得出结论前请查看报告中的测量质量说明。",
