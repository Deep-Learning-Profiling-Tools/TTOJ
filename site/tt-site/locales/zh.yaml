  "The envelope spans the earliest start to the latest end within one core and occurrence. It is not a sum of parallel stages or total chip elapsed time.": "包络取同一核心、同一阶段序号内的最早开始与最晚结束。它不是并行阶段耗时之和，也不是整张芯片的总耗时。",
  "The CSV clock is a snapshot taken when the profiler initializes. Microsecond conversions assume it stays constant; frequency changes are not tracked for each event.": "CSV 中的设备时钟来自 profiler 初始化时的一次快照。换算微秒时假设时钟保持不变；它没有逐事件跟踪频率变化。",
