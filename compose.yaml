name: tenstorrent-oj
services:
  mongo:
    image: mongo:7-jammy
    cpuset: "${SERVICE_CPUSET:-0-3,8-11}"
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
  site:
    build:
      context: ./site
      args:
        TTOJ_SOURCE_REF: "${TTOJ_SOURCE_REF:-main}"
    cpuset: "${SERVICE_CPUSET:-0-3,8-11}"
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - hydro-config:/root/.hydro
      - hydro-files:/data/files
      - ./problems:/problems:ro
      - ./data/profiles:/data/tt-profiles:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /root/.hydro/tt-bootstrap-complete && node /app/healthcheck.cjs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
  worker:
    cpuset: "${SERVICE_CPUSET:-0-3,8-11}"
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      HYDRO_URL: http://site:8888/
      JUDGE_USERNAME: ${JUDGE_USERNAME}
      JUDGE_PASSWORD: ${JUDGE_PASSWORD}
      JOBS_DIR: /jobs
      PROFILES_DIR: /profiles
      BENCHMARK_CPUSET: "${BENCHMARK_CPUSET:-4-7,12-15}"
      TT_OJ_DEVICE_PROFILER_SUPPORTED: "1"
      JOBS_HOST_DIR: "${JOBS_HOST_DIR:-${PWD}/data/jobs}"
      TTNN_IMAGE: "${TTNN_IMAGE:-tt-oj-profiler-runtime:0.79.0}"
      METALIUM_IMAGE: "${METALIUM_IMAGE:-tt-oj-metalium-profiler:0.79.0}"
      TTLANG_IMAGE: "${TTLANG_IMAGE:-tt-oj-ttlang-runtime:1.1.10}"
    depends_on:
      site:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/jobs:/jobs
      - ./data/profiles:/profiles
      - /sys:/host-sys:ro
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import json; assert json.load(open('/jobs/worker-status.json'))['connected']"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
volumes:
  mongo-data:
  hydro-config:
  hydro-files:
